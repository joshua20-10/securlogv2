<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#050b1a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png">
<title>SecurLog</title>
<style>
:root{--bg:#050b1a;--c:#0d1830;--l:#1b2c52;--t:#e8eefc;--m:#8a9bc4;--b:#1e90ff;--r:#ff5a5f;--g:#2ecc71;--o:#f5a623}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(circle at 50% -20%,#0b2a5c,var(--bg) 60%) fixed;color:var(--t);font:15px system-ui,sans-serif;min-height:100vh}
header{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--l);background:#071022ee;position:sticky;top:0;z-index:5}
header img{height:34px}header b{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;border-bottom:1px solid var(--l)}
nav a{padding:8px 12px;border-radius:8px;color:var(--m);white-space:nowrap;cursor:pointer}nav a.on{background:var(--b);color:#fff}
main{padding:14px;max-width:980px;margin:auto}
.card{background:var(--c);border:1px solid var(--l);border-radius:12px;padding:14px;margin:0 0 12px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.k{font-size:30px;font-weight:700;color:var(--b)}.m{color:var(--m);font-size:13px}.w{color:var(--o)}.ok{color:var(--g)}.ko{color:var(--r)}
input,select,textarea,button{font:inherit;color:var(--t);background:#0a1429;border:1px solid var(--l);border-radius:8px;padding:10px;width:100%;margin:4px 0}
input[type=checkbox]{width:auto;margin:4px}
button{background:var(--b);border:0;font-weight:600;cursor:pointer;width:auto;margin-right:6px}
button.s{background:#16294d}button.d{background:var(--r)}button.big{width:100%;padding:14px}
.r{display:flex;gap:8px;flex-wrap:wrap}.r>*{flex:1;min-width:130px}
.chip{display:inline-block;background:#16294d;border-radius:20px;padding:3px 10px;margin:2px;font-size:13px}.chip a,a[data-a]{cursor:pointer}
.lg{max-width:380px;margin:auto;padding:20px}.lg img{width:100%;border-radius:12px;margin-bottom:10px}
.pw{position:relative}.pw a{position:absolute;right:12px;top:14px;cursor:pointer}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#16294d;border:1px solid var(--b);padding:12px 18px;border-radius:10px;z-index:30;max-width:90%}
.bm{background:#f5a623;color:#000;border-radius:50%;width:24px;height:24px;text-align:center;line-height:20px;font-weight:700;border:2px solid #fff}
.ov{position:fixed;inset:0;background:#000;z-index:25;display:flex;flex-direction:column;align-items:center}.ov video{width:100%;flex:1;object-fit:cover}
#pr{position:fixed;inset:0;background:#fff;color:#000;z-index:20;overflow:auto;padding:16px}
#pr button{color:#fff}.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.qr{border:1px dashed #888;padding:8px;text-align:center}.qr svg{width:100%;height:auto}.qr small{display:block}
.bd{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;margin:0 4px 4px 0;color:#fff}
.dh{margin:18px 0 8px;color:var(--m);font-size:13px;text-transform:uppercase;letter-spacing:.06em}
.tl{border-left:2px solid var(--l);margin:10px 0 8px 6px;padding-left:12px}.tl>div{margin:0 0 8px}
.ag{width:34px;height:34px;border-radius:50%;background:#1e90ff;border:3px solid #fff;color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 0 #1e90ffaa;animation:pl 2s infinite}.ag.old{background:#6b7897;animation:none}
@keyframes pl{70%{box-shadow:0 0 0 14px #1e90ff00}100%{box-shadow:0 0 0 0 #1e90ff00}}
.leaflet-popup-content button{background:#1e90ff;color:#fff;border:0;border-radius:8px;padding:8px 10px}
@media print{body>*:not(#pr){display:none}#pr{position:static}.np{display:none}}

const app=initializeApp(firebaseConfig);
// Cache hors ligne intégré : lectures du cache + écritures mises en file puis synchronisées automatiquement
const db=initializeFirestore(app,{experimentalAutoDetectLongPolling:true,localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});

const $=s=>document.querySelector(s),uid=()=>crypto.randomUUID(),fd=f=>Object.fromEntries(new FormData(f));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opt=(a,sel)=>a.map(([v,l])=>`<option value="${esc(v)}"${v==sel?' selected':''}>${esc(l)}</option>`).join('');
const CATS=[['observation','Observation'],['incident','Incident'],['intervention','Intervention'],['controle','Contrôle'],['ronde','Ronde'],['accident','Accident'],['degradation','Dégradation'],['intrusion','Intrusion'],['assistance_personne','Assistance à personne'],['alarme','Alarme'],['autre','Autre']];
const PRIO=[['basse','Basse'],['normale','Normale'],['haute','Haute'],['critique','Critique']];
const RT=[['pied','Ronde à pied'],['vehicule','Ronde véhicule'],['interieure','Intérieure'],['exterieure','Extérieure'],['ouverture','Ouverture'],['fermeture','Fermeture']];
const JRS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
let me=null,cur='dash',idle,pend=0,hold=0,note='',justLogged=false;
const dt=d=>d?.toDate?d.toDate():(d?new Date(d):null);
const fmt=d=>{d=dt(d);return d?d.toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}):''};
const tm=d=>dt(d)?.getTime()||0;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),4000)}
const errm=e=>e.code=='permission-denied'?'Écriture refusée par Firebase (permission-denied). Les règles Firestore ne sont pas publiées, ou bien QR invalide / déjà enregistré.':(e.code?e.code+' : ':'')+(e.message||'Erreur');
const W=p=>{pend++;bar();p.catch(e=>toast(errm(e))).finally(()=>{pend--;bar()});return p};   // suivi des écritures en cours
function bar(){const e=$('#sb');if(e)e.innerHTML=(navigator.onLine?'':'<span class=w>Hors ligne</span> ')+(pend||hold?`<span class=w>⏳ ${pend?pend+' à synchroniser':'synchronisation…'}</span>`:(navigator.onLine?'<span class=m>✓ synchronisé</span>':''))}
// Envoi des données gardées sur le téléphone : se relance au retour du réseau et à chaque réouverture de l'application
const settle=()=>{hold++;bar();return waitForPendingWrites(db).catch(()=>{}).finally(()=>{hold--;bar()})};
async function syncNow(){
  if(!navigator.onLine)return toast('Pas de réseau : les données restent sur le téléphone et partiront dès le retour du réseau');
  try{await disableNetwork(db);await enableNetwork(db)}catch(e){}
  const r=await Promise.race([settle().then(()=>'ok'),new Promise(r=>setTimeout(()=>r('lent'),15000))]);
  toast(r=='ok'?'Tout est synchronisé':'Synchronisation en cours, elle continuera toute seule');
}
addEventListener('online',()=>{bar();enableNetwork(db).catch(()=>{});settle()});addEventListener('offline',bar);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState=='visible'&&me)settle()});
addEventListener('beforeunload',e=>{if(pend){e.preventDefault();e.returnValue=''}});
try{navigator.storage?.persist?.()}catch(e){}   // demande à Android de ne pas effacer les données gardées hors ligne
const hv=(a,b,c,d)=>{const R=6371e3,r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
const pos=()=>new Promise(r=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>r(p.coords),()=>r(null),{timeout:5000,maximumAge:30000,enableHighAccuracy:true}):r(null));
const gd=async q=>{try{return navigator.onLine?await getDocs(q):await getDocsFromCache(q)}catch(e){try{return await getDocsFromCache(q)}catch(_){throw e}}};
const list=s=>s.docs.map(d=>({id:d.id,...d.data({serverTimestamps:'estimate'}),_p:d.metadata.hasPendingWrites}));
const rows=async q=>list(await gd(q));
const token=()=>[...crypto.getRandomValues(new Uint8Array(24))].map(b=>b.toString(16).padStart(2,'0')).join('');
const hx=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const hashPw=async(pw,salt)=>hx(await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveBits']),256));
const newCred=async pw=>{const salt=token();return{salt,hash:await hashPw(pw,salt)}};
const uname=s=>s.trim().toLowerCase().replace(/[^a-z0-9._@-]/g,'');
const mail=s=>s.includes('@')?s.trim():s.trim()+'@securlog.local';

// ---------- Clés d'accès (passkeys / WebAuthn) : empreinte, visage ou code de l'appareil, via le gestionnaire de mots de passe Google, iCloud, etc. ----------
// La clé privée reste dans l'appareil. Seule la clé publique est enregistrée dans la fiche de l'utilisateur ; la signature est vérifiée ici, comme le mot de passe.
const PK_OK=!!(window.PublicKeyCredential&&navigator.credentials&&window.isSecureContext&&(location.protocol=='https:'||location.hostname=='localhost'||location.hostname=='127.0.0.1'));   // pas en fichier local (file://)
const b64u=b=>btoa(String.fromCharCode(...new Uint8Array(b))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
const unb64u=t=>Uint8Array.from(atob(t.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((t.length+3)%4)),c=>c.charCodeAt(0));
const concatB=(a,b)=>{const r=new Uint8Array(a.length+b.length);r.set(a);r.set(b,a.length);return r};
function derToRaw(d){   // signature ECDSA DER -> r||s (64 octets)
  d=new Uint8Array(d);let i=2;if(d[1]&0x80)i=2+(d[1]&0x7f);
  const rd=()=>{i++;let l=d[i++],v=d.slice(i,i+l);i+=l;while(v.length>32&&v[0]==0)v=v.slice(1);const o=new Uint8Array(32);o.set(v,32-v.length);return o};
  const r=rd(),t=rd();return concatB(r,t);
}
async function pkVerify(pk,cred,challenge){   // vérifie la signature d'une connexion par clé d'accès
  const r=cred.response,cd=new Uint8Array(r.clientDataJSON),ad=new Uint8Array(r.authenticatorData);
  const c=JSON.parse(new TextDecoder().decode(cd));
  if(c.type!=='webauthn.get'||c.challenge!==b64u(challenge)||c.origin!==location.origin)return false;
  if(b64u(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(location.hostname)))!==b64u(ad.slice(0,32)))return false;
  if(!(ad[32]&1)||!(ad[32]&4))return false;   // présence + vérification de l'utilisateur (empreinte / code) obligatoires
  const data=concatB(ad,new Uint8Array(await crypto.subtle.digest('SHA-256',cd))),spki=unb64u(pk.pk);
  if(pk.alg==-7){const k=await crypto.subtle.importKey('spki',spki,{name:'ECDSA',namedCurve:'P-256'},false,['verify']);return crypto.subtle.verify({name:'ECDSA',hash:'SHA-256'},k,derToRaw(r.signature),data)}
  if(pk.alg==-257){const k=await crypto.subtle.importKey('spki',spki,{name:'RSASSA-PKCS1-v1_5',hash:'SHA-256'},false,['verify']);return crypto.subtle.verify('RSASSA-PKCS1-v1_5',k,r.signature,data)}
  return false;
}
async function pkLogin(){   // connexion : le gestionnaire de mots de passe propose les clés d'accès de cet appareil
  const challenge=crypto.getRandomValues(new Uint8Array(32));
  const cred=await navigator.credentials.get({publicKey:{challenge,rpId:location.hostname,userVerification:'required',timeout:120000}});
  if(!cred)return{err:'Aucune clé d\'accès choisie'};
  const bad='Clé d\'accès non reconnue. Connectez-vous avec votre mot de passe, puis recréez-la avec le bouton 🔐.';
  let id;try{id=new TextDecoder().decode(cred.response.userHandle)}catch(e){}
  if(!id)return{err:bad};
  const s=await getDoc(doc(db,'users',id));if(!s.exists())return{err:bad};
  const u=s.data(),pk=(u.passkeys||[]).find(k=>k.id==b64u(cred.rawId));
  if(!pk||!await pkVerify(pk,cred,challenge))return{err:bad};
  if(id==uname(ADMIN.id))return{id,u:adminUser()};
  if(!u.active)return{err:'Compte désactivé'};
  return{id,u};
}
async function pkCreate(){   // enregistre une clé d'accès pour l'utilisateur connecté
  if(!PK_OK)throw new Error('Clés d\'accès indisponibles : ouvrez SecurLog depuis son adresse https, pas depuis un fichier local');
  const old=(await getDoc(doc(db,'users',me.id))).data()?.passkeys||[];
  const cred=await navigator.credentials.create({publicKey:{
    rp:{name:'SecurLog',id:location.hostname},
    user:{id:new TextEncoder().encode(me.id),name:me.id,displayName:me.name||me.id},
    challenge:crypto.getRandomValues(new Uint8Array(32)),
    pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{residentKey:'required',requireResidentKey:true,userVerification:'required'},
    excludeCredentials:old.map(k=>({type:'public-key',id:unb64u(k.id)})),timeout:120000,attestation:'none'}});
  const r=cred.response;if(!r.getPublicKey)throw new Error('Ce navigateur ne permet pas de lire la clé publique : mettez-le à jour');
  const entry={id:b64u(cred.rawId),pk:b64u(r.getPublicKey()),alg:r.getPublicKeyAlgorithm(),name:'Clé du '+new Date().toLocaleDateString('fr-FR')+' ('+(/iPhone|iPad/.test(navigator.userAgent)?'iPhone/iPad':/Android/.test(navigator.userAgent)?'Android':'ordinateur')+')',at:new Date().toISOString()};
  await setDoc(doc(db,'users',me.id),{passkeys:arrayUnion(entry)},{merge:true});
  try{localStorage.sl_pk='1'}catch(e){}
  return entry;
}
async function pkManage(){   // petite fenêtre : liste, ajout et suppression des clés d'accès de l'utilisateur
  const o=document.createElement('div');o.className='ov';o.style.cssText='background:#000c;justify-content:center;padding:14px;overflow:auto';document.body.append(o);
  const draw=async()=>{
    let ks=[];try{ks=(await getDoc(doc(db,'users',me.id))).data()?.passkeys||[]}catch(e){}
    o.innerHTML=`<div class=card style="max-width:420px;width:100%"><h3>🔐 Clés d'accès</h3>
      <p class=m>Connectez-vous avec votre empreinte, votre visage ou le code de l'appareil, sans taper de mot de passe. Le mot de passe reste utilisable.</p>
      ${ks.map(k=>`<div class=r style="align-items:center"><span>${esc(k.name)}</span><button class=d data-del="${esc(k.id)}" style="flex:0">Retirer</button></div>`).join('')||'<p class=m>Aucune clé d\'accès enregistrée.</p>'}
      ${PK_OK?'<button class=big id=pkadd>Créer une clé d\'accès sur cet appareil</button>':'<p class=w>Non disponible ici : ouvrez SecurLog depuis son adresse https (votre site GitHub Pages), pas depuis un fichier de votre ordinateur.</p>'}
      <button class="s big" id=pkx>Fermer</button></div>`;
    $('#pkx').onclick=()=>o.remove();
    const add=$('#pkadd');if(add)add.onclick=async()=>{add.disabled=true;try{await pkCreate();toast('Clé d\'accès créée');draw()}catch(e){add.disabled=false;toast(e.name=='NotAllowedError'?'Création annulée':e.name=='InvalidStateError'?'Une clé existe déjà sur cet appareil':e.message||'Échec')}};
    o.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{if(!confirm('Retirer cette clé d\'accès ?'))return;
      try{await updateDoc(doc(db,'users',me.id),{passkeys:ks.filter(k=>k.id!=b.dataset.del)});toast('Clé retirée');draw()}catch(e){toast(errm(e))}});
  };draw();
}

// ---------- Demandes d'aide à la connexion ----------
let unHelp=null,helpSeen=false;
function helpDlg(id0='',why=''){   // depuis l'écran de connexion : prévient les administrateurs
  const o=document.createElement('div');o.className='ov';o.style.cssText='background:#000c;justify-content:center;padding:14px;overflow:auto';document.body.append(o);
  o.innerHTML=`<div class=card style="max-width:420px;width:100%"><h3>🆘 Demander de l'aide</h3><p class=m>Un administrateur sera prévenu dans l'application et pourra réinitialiser votre accès.</p>
    <input id=hi placeholder="Votre identifiant" value="${esc(id0)}" autocapitalize=none><input id=hn placeholder="Votre nom (facultatif)"><textarea id=hm rows=3 placeholder="Précisez le problème (facultatif)"></textarea><p class=w id=he></p>
    <button class=big id=hs>Envoyer la demande</button><button class="s big" id=hx style="margin-top:8px">Annuler</button></div>`;
  $('#hx').onclick=()=>o.remove();
  $('#hs').onclick=async()=>{const er=t=>{$('#he').textContent=t},lg=uname($('#hi').value),nm=$('#hn').value.trim();
    if(!lg&&!nm)return er('Indiquez votre identifiant ou votre nom');
    if(Date.now()-(+localStorage.sl_help||0)<120000)return er('Une demande vient d\'être envoyée : patientez quelques minutes');
    $('#hs').disabled=true;er('');
    const p=addDoc(collection(db,'helpRequests'),{login:lg,name:nm,message:$('#hm').value.trim(),reason:why||null,status:'ouvert',at:serverTimestamp(),atClient:Timestamp.fromDate(new Date()),device:navigator.userAgent.slice(0,120)});
    try{const r=await Promise.race([p.then(()=>'ok'),new Promise(r=>setTimeout(()=>r('lent'),6000))]);
      try{localStorage.sl_help=Date.now()}catch(e){}
      o.querySelector('.card').innerHTML=`<h3>${r=='ok'?'✅ Demande envoyée':'⏳ Demande enregistrée'}</h3><p>${r=='ok'?'Les administrateurs ont été prévenus. Patientez, quelqu\'un va vous aider.':'Pas de réseau pour le moment : la demande partira dès que la connexion reviendra (gardez l\'application ouverte).'}</p><button class=big id=hx2>Fermer</button>`;$('#hx2').onclick=()=>o.remove()}
    catch(e){$('#hs').disabled=false;er(e.code=='permission-denied'?'Demande refusée : les règles Firestore doivent être republiées (fichier firestore.rules).':'Demande non envoyée : '+(e.code||e.message))}};
}
function notifyHelp(r){   // administrateur : alerte sonore, vibration et notification
  const t='Demande d\'aide : '+(r.name||r.login||'un agent');toast('🆘 '+t);
  try{navigator.vibrate?.([300,150,300])}catch(e){}
  try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();setTimeout(()=>{o.stop();a.close()},350)}catch(e){}
  if('Notification' in window&&Notification.permission=='granted'){const b=r.message||r.reason||'Un agent n\'arrive pas à se connecter';
    navigator.serviceWorker?.ready.then(w=>w.showNotification('SecurLog · '+t,{body:b,icon:ICON,tag:'help'})).catch(()=>{try{new Notification('SecurLog · '+t,{body:b})}catch(e){}})}
}
function watchHelp(){
  if(unHelp)unHelp();helpSeen=false;
  unHelp=onSnapshot(query(collection(db,'helpRequests'),where('status','==','ouvert')),s=>{
    const rs=list(s).sort((a,b)=>tm(b.at)-tm(a.at)),hb=$('#hb');
    if(hb){hb.innerHTML=rs.map(r=>`<div class=card style="border-color:var(--r);margin:8px 14px"><b>🆘 Demande d'aide</b> · ${esc(r.name||r.login||'?')} <span class=m>(identifiant : ${esc(r.login||'?')})</span><div class=m>${fmt(r.atClient||r.at)}${r.reason?' · '+esc(r.reason):''}</div>${r.message?`<p style="white-space:pre-wrap">${esc(r.message)}</p>`:''}<button data-hr="${r.id}">✔ Traité</button><button class=s data-hg=1>Aller aux agents</button></div>`).join('');
      hb.onclick=e=>{const d=e.target.dataset;if(d.hg)go('ag');if(d.hr)W(updateDoc(doc(db,'helpRequests',d.hr),{status:'traite',handledBy:me.name||me.id,handledAt:serverTimestamp()}))}}
    if(helpSeen)s.docChanges().forEach(c=>{if(c.type=='added'&&!c.doc.metadata.hasPendingWrites)notifyHelp(c.doc.data())});
    helpSeen=true;
  },()=>{});
}

// ---------- Connexion (gérée par l'application : pas de Firebase Authentication) ----------
const adminUser=()=>({name:ADMIN.name,role:'admin',active:true,siteIds:[],permissions:{viewSiteEvents:true},code:true});
async function syncAdmin(id,pw){   // en arrière-plan : garde le compte admin du code présent dans la base (n'empêche jamais la connexion)
  try{const s=await getDoc(doc(db,'users',id));
    const ok=s.exists()&&s.data().salt&&await hashPw(pw,s.data().salt)==s.data().hash&&s.data().role=='admin'&&s.data().active;
    if(!ok)await setDoc(doc(db,'users',id),{role:'admin',active:true,permissions:{viewSiteEvents:true},...(s.exists()?{}:{name:ADMIN.name,siteIds:[],createdAt:serverTimestamp()}),...await newCred(pw)},{merge:true})}catch(e){}
}
async function check(id,pw){
  const bad='Identifiant ou mot de passe incorrect';
  if(id==uname(ADMIN.id)&&pw==ADMIN.password){syncAdmin(id,pw);return{u:adminUser()}}   // admin défini dans le code : vérifié ICI, sans Firebase
  const s=await getDoc(doc(db,'users',id));   // autres comptes : la fiche (identifiant + empreinte du mot de passe) est lue dans la base, la vérification se fait ici
  if(!s.exists())return{err:bad};
  const u=s.data();if(!u.salt||await hashPw(pw,u.salt)!==u.hash)return{err:bad};
  if(!u.active)return{err:'Compte désactivé'};
  return{u};
}
function login(msg='',auto=false){
  me=null;if(unHelp){unHelp();unHelp=null}if(wid!=null){navigator.geolocation.clearWatch(wid);wid=null}document.body.innerHTML=`<div class=lg><img src="${LOGO}" alt=SecurLog><form id=f class=card><h3>Connexion</h3><p class=w id=er>${esc(msg)}</p>
  <input name=e placeholder="Identifiant" autocomplete=username autocapitalize=none required>
  <div class=pw><input name=p id=p type=password placeholder="Mot de passe" autocomplete=current-password required><a id=sh>👁</a></div>
  <button class=big id=go>Se connecter</button>${PK_OK?'<button type=button class="s big" id=pkb style="margin-top:8px">🔐 Se connecter avec une clé d\'accès</button>':'<p class=m style="margin-top:8px">🔐 Clé d\'accès : disponible seulement depuis l\'adresse https du site (pas depuis un fichier de l\'ordinateur).</p>'}<p class=m id=hl style="margin-top:12px"><a id=help style="color:var(--b);cursor:pointer;text-decoration:underline">🆘 Besoin d\'aide ? Prévenir un administrateur</a></p></form></div>`;
  let fails=0,why='';
  const askHelp=()=>helpDlg(uname(document.querySelector('[name=e]').value),why);
  $('#help').onclick=askHelp;
  $('#sh').onclick=()=>$('#p').type=$('#p').type=='password'?'text':'password';
  const pkGo=async()=>{const er=t=>{$('#er').textContent=t},b=$('#pkb');if(!b)return;b.disabled=true;er('');
    try{const r=await pkLogin();if(r.err){er(r.err);b.disabled=false;return}
      sessionStorage.sl_sess=JSON.stringify({id:r.id,hash:r.u.hash||'code'});justLogged=true;start(r.id,r.u)}
    catch(e){b.disabled=false;if(e.name!='NotAllowedError'&&e.name!='AbortError')er(e.code=='unavailable'?'Réseau indisponible':'Clé d\'accès : '+(e.message||e.name))}};
  if($('#pkb'))$('#pkb').onclick=pkGo;
  if(auto&&PK_OK&&localStorage.sl_pk)setTimeout(pkGo,300);   // appareil déjà équipé : la demande d'empreinte s'ouvre toute seule
  $('#f').onsubmit=async ev=>{ev.preventDefault();const v=fd(ev.target),id=uname(v.e),b=$('#go'),er=t=>{$('#er').textContent=t};
    b.disabled=true;b.textContent='Connexion en cours…';er('');
    try{
      const r=await Promise.race([check(id,v.p),new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),15000))]);
      if(r.err){er(r.err);why=r.err;b.disabled=false;b.textContent='Se connecter';if(++fails>=2){$('#hl').innerHTML='<button type=button class="d big" id=help2>🆘 Je n\'arrive pas à me connecter : prévenir un administrateur</button>';$('#help2').onclick=askHelp}return}
      sessionStorage.sl_sess=JSON.stringify({id,hash:r.u.hash||'code'});justLogged=true;start(id,r.u);
    }catch(e){b.disabled=false;b.textContent='Se connecter';
      er(e.code=='permission-denied'?'Accès refusé : publiez les règles Firestore (fichier firestore.rules)':e.code=='timeout'?'Le serveur ne répond pas. Vérifiez Internet, que la base Firestore est créée dans Firebase et que les règles sont publiées.':!navigator.onLine?'Pas de réseau (la première connexion sur cet appareil nécessite Internet)':e.code=='unavailable'?'Ces identifiants ne correspondent pas au compte admin du code (admin / 1234), donc l\'application a cherché le compte dans la base Firebase, qui ne répond pas. Pour l\'admin, retapez exactement : admin et 1234.':'Erreur : '+(e.code||e.message))}};
}
function start(id,u){
  me={id,...u};shell();go('dash');settle();
  if(me.role=='admin'){watchHelp();if('Notification' in window&&Notification.permission=='default'&&!localStorage.sl_ntask)setTimeout(()=>{try{localStorage.sl_ntask='1'}catch(e){}if(confirm('Recevoir une notification quand un agent demande de l\'aide ?'))Notification.requestPermission()},5000)}
  if(justLogged){justLogged=false;
    if(PK_OK&&!localStorage.sl_pk&&!localStorage.sl_pkask)setTimeout(async()=>{try{localStorage.sl_pkask='1'}catch(e){}
      if(confirm('Se connecter la prochaine fois avec votre empreinte ou le code de l\'appareil (clé d\'accès) ?'))try{await pkCreate();toast('Clé d\'accès créée : elle sera proposée à la prochaine connexion')}catch(e){toast(e.name=='NotAllowedError'?'Création annulée (bouton 🔐 pour réessayer)':e.message||'Échec')}},1500);
    W(addDoc(collection(db,'loginLog'),{uid:id,name:u.name||'',at:serverTimestamp(),ua:navigator.userAgent.slice(0,200)}))}
}
async function boot(){
  try{localStorage.removeItem('sl_sess')}catch(e){}   // ancienne session persistante : supprimée
  const ss=JSON.parse(sessionStorage.sl_sess||'null');if(!ss)return login('',true);
  if(ss.hash=='code'&&ss.id==uname(ADMIN.id))return start(ss.id,adminUser());
  try{const s=await getDoc(doc(db,'users',ss.id));
    if(!s.exists()||s.data().hash!==ss.hash||!s.data().active){sessionStorage.removeItem('sl_sess');return login('Session expirée ou compte désactivé')}
    start(ss.id,s.data())}catch(e){login('Connexion impossible : '+(e.code||'réseau'))}
}
async function logout(){
  if((pend||hold)&&!confirm('Des données ne sont pas encore synchronisées. Se déconnecter quand même ?'))return;
  sessionStorage.removeItem('sl_sess');login();
}
function shell(){
  const nav=me.role=='admin'?[['dash','Tableau de bord'],['map','Carte'],['ev','Main courante'],['ro','Rondes & QR'],['si','Sites'],['ag','Agents']]:[['dash','Accueil'],['ev','Main courante'],['ro','Rondes']];
  document.body.innerHTML=`<header><img src="${ICON}" alt=""><b>SecurLog <span class=m>${me.role=='admin'?'Admin':'Agent'}</span></b><span id=sb class=m></span><button class=s id=pw title="Changer mon mot de passe">🔑</button><button class=s id=pk title="Clés d'accès (empreinte)">🔐</button><button class=s id=lo>Quitter</button></header>
  <nav>${nav.map(([v,l])=>`<a data-v=${v}>${l}</a>`).join('')}</nav><div id=hb></div><main id=v></main>`;
  document.querySelector('nav').onclick=e=>e.target.dataset.v&&go(e.target.dataset.v);$('#lo').onclick=logout;$('#sb').onclick=syncNow;$('#sb').style.cursor='pointer';$('#sb').title='Synchroniser maintenant';bar();
  $('#pk').onclick=pkManage;
  $('#pw').onclick=async()=>{if(me.code)return toast('Le mot de passe de l\'admin principal se change dans le code (ligne ADMIN de index.html).');const p=prompt('Nouveau mot de passe (6 caractères minimum)');if(!p||p.length<6)return;const c=await newCred(p);
    try{await updateDoc(doc(db,'users',me.id),c);sessionStorage.sl_sess=JSON.stringify({id:me.id,hash:c.hash});toast('Mot de passe modifié')}catch(e){toast(errm(e))}};
  const rs=()=>{clearTimeout(idle);idle=setTimeout(()=>{sessionStorage.removeItem('sl_sess');login('Déconnecté pour inactivité')},30*60e3)};
  ['click','keydown','touchstart'].forEach(e=>addEventListener(e,rs));rs();
}
async function go(v){
  cur=v;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('on',a.dataset.v==v));
  $('#v').innerHTML='<p class=m>Chargement…</p>';
  try{await Promise.race([(v=='ev'?EV:(me.role=='admin'?A:G)[v])(),new Promise((_,j)=>setTimeout(()=>j({code:'timeout'}),12000))])}
  catch(e){
    if(e.code=='timeout'||e.code=='unavailable'){
      $('#v').innerHTML='<div class=card><p class=w>La base Firebase ne répond pas, les données ne peuvent pas s\'afficher.</p><p class=m id=dg>Diagnostic en cours…</p><button id=rt>Réessayer</button></div>';
      $('#rt').onclick=()=>go(v);diag().then(t=>{const d=$('#dg');if(d)d.textContent=t});
    }else $('#v').innerHTML='<p class=w>Erreur : '+esc(errm(e))+'</p>'}
}
async function diag(){   // interroge Firestore directement pour dire précisément ce qui bloque
  try{
    const r=await fetch(`https://firestore.googleapis.com/v1/projects/${firebaseConfig.projectId}/databases/(default)/documents/users?pageSize=1&key=${firebaseConfig.apiKey}`);
    if(r.ok)return 'La base répond bien, mais pas la connexion temps réel de l\'application. Essayez sur un autre réseau (4G à la place du Wi-Fi), ou désactivez VPN et bloqueur de publicité.';
    const j=await r.json().catch(()=>({})),m=j.error?.message||'';
    if(r.status==404)return 'La base Firestore n\'existe pas encore. Dans la console Firebase (projet '+firebaseConfig.projectId+') : Build › Firestore Database › Créer une base de données (mode production), puis publiez les règles du fichier firestore.rules.';
    if(/permission|insufficient/i.test(m))return 'Accès refusé : les règles Firestore ne sont pas publiées. Collez le contenu de firestore.rules dans Firestore › Règles, puis cliquez sur Publier.';
    if(r.status==403)return 'Accès refusé (403) : l\'API Cloud Firestore est désactivée ou la clé API est restreinte. Détail : '+m;
    return 'Réponse de Firebase '+r.status+' : '+m;
  }catch(e){return 'Impossible de joindre firestore.googleapis.com depuis cet appareil (réseau, VPN, bloqueur de publicité ou pare-feu).'}
}
async function mySites(){

async function scan(id,rid,sid,cps,done){
  if(!('BarcodeDetector' in window))return alert('Scanner non supporté. Utilisez Chrome sur Android.');
  const st=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).catch(()=>null);
  if(!st)return alert('Accès à la caméra refusé');
  const o=document.createElement('div');o.className='ov';o.innerHTML='<video playsinline muted></video><button class=d style="margin:12px">Fermer</button>';document.body.append(o);
  const v=o.querySelector('video');v.srcObject=st;await v.play();
  const bd=new BarcodeDetector({formats:['qr_code']});let on=true;
  const stop=()=>{on=false;st.getTracks().forEach(t=>t.stop());o.remove()};o.querySelector('button').onclick=stop;
  while(on){
    try{const r=await bd.detect(v);
      if(r[0]){const raw=r[0].rawValue;stop();await onTok(id,rid,sid,cps,raw);return done()}}catch(e){}
    await new Promise(r=>setTimeout(r,300));
  }
}
async function onTok(id,rid,sid,cps,raw){
  const m=/^SL1:([A-Za-z0-9]+)\.([0-9a-f]{48})$/.exec(raw);
  if(!m)return toast('QR code non reconnu');
  const [,cp,tok]=m;if(!cps.find(c=>c.id==cp))return toast("Ce QR code n'appartient pas à cette ronde");
  const c=await pos();
  const p=setDoc(doc(db,'scans',id+'_'+cp),{runId:id,checkpointId:cp,roundId:rid,siteId:sid,agentId:me.id,agentName:me.name||'',token:tok,scannedAt:Timestamp.now(),receivedAt:serverTimestamp(),wasOffline:!navigator.onLine,
    lat:c?.latitude??null,lng:c?.longitude??null,accuracy:c?.accuracy??null,anomaly:$('#an')?.checked||false,note:$('#nt')?.value||null});
  p.catch(e=>{if(e.code=='permission-denied')toast('Scan refusé par le serveur : QR invalide, désactivé ou point déjà validé')});
  const r=await Promise.race([p.then(()=>'ok',()=>'ko'),new Promise(r=>setTimeout(()=>r('later'),2500))]);
  toast(r=='ok'?'✔ Point validé (vérifié par le serveur)':r=='ko'?'Refusé : QR invalide, désactivé ou point déjà validé':'Scan enregistré, en attente du serveur (NON vérifié en temps réel)');
}

      <div>${JRS.map((j,i)=>`<label><input type=checkbox name=d value=${i+1} checked>${j}</label>`).join('')}</div><button>Créer la ronde</button></form></div>`+
    rs.map(r=>{const cps=cp.filter(c=>c.roundId==r.id).sort((a,b)=>a.position-b.position);return `<div class=card data-r="${r.id}"><b>${esc(r.name)}</b> <span class=m>${esc(r.type)} · ${esc(r.startTime||'')}${r.endTime?'–'+r.endTime:''} · ${(r.days||[]).map(d=>JRS[d-1]).join(' ')}${r.frequencyMinutes?' · /'+r.frequencyMinutes+' min':''}</span>
      ${cps.map(c=>`<div data-c="${c.id}">${c.position}. ${c.active?'':'<s>'}<b>${esc(c.name)}</b>${c.active?'':'</s>'} <span class=m>${esc(c.locationDesc||'')}</span>
        <a data-a=up>↑</a> <a data-a=dn>↓</a> ${c.lat!=null?'📍':''}<a data-a=gps>[📍 Ici]</a> <a data-a=qr>[QR]</a> <a data-a=del style="color:var(--r)">[Supprimer]</a> <a data-a=tog data-on="${c.active}">[${c.active?'Désactiver':'Activer'}]</a></div>`).join('')}
      <form class=r data-a=addcp><input name=name placeholder="Nouveau point de contrôle" required><input name=loc placeholder="Emplacement"><button style="flex:0">+</button></form>
      <button class=s data-a=sheet>🖨 Planche QR de la ronde (PDF / impression)</button></div>`}).join('')+
    `<div class=card><h3>Derniers scans</h3>${sl.map(s=>{const ok=tm(s.receivedAt)-tm(s.scannedAt)<120000;return `<div>${fmt(s.scannedAt)} · ${esc(cn[s.checkpointId]||'(point supprimé)')} · ${esc(s.agentName)} ${ok?'<span class=ok>vérifié</span>':'<span class=w>hors ligne / différé</span>'} ${s.anomaly?'<span class=ko>anomalie</span>':''} <span class=m>${esc(s.note||'')}</span></div>`}).join('')||'<p class=m>Aucun scan.</p>'}</div>`;
    $('#ss').onchange=e=>{localStorage.sl_site=e.target.value;go('ro')};
    $('#f').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),v=Object.fromEntries(f);
      await W(addDoc(collection(db,'rounds'),{siteId:sid,name:v.name,type:v.type,startTime:v.start_time||null,endTime:v.end_time||null,frequencyMinutes:v.freq?+v.freq:null,days:f.getAll('d').map(Number),active:true,createdAt:serverTimestamp()}));go('ro')};
    $('#v').onsubmit=async e=>{const f=e.target;if(f.dataset.a!='addcp')return;e.preventDefault();f.querySelector('button').disabled=true;   // une seule écoute (affectation) + bouton bloqué : un seul point créé
      const rid=f.closest('[data-r]').dataset.r,v=fd(f),mx=Math.max(0,...cp.filter(c=>c.roundId==rid).map(c=>c.position)),cid=uid(),b=writeBatch(db);
      b.set(doc(db,'checkpoints',cid),{roundId:rid,siteId:sid,name:v.name,locationDesc:v.loc||null,lat:null,lng:null,position:mx+1,active:true,createdAt:serverTimestamp()});
      b.set(doc(db,'qrSecrets',cid),{token:token(),createdAt:serverTimestamp()});   // jeton secret 192 bits, lisible par les admins uniquement
      await W(b.commit());go('ro')};
    $('#v').onclick=async e=>{const t=e.target,a=t.dataset.a;if(!a||a=='addcp')return;
      const rid=t.closest('[data-r]')?.dataset.r,r=rs.find(x=>x.id==rid),cid=t.closest('[data-c]')?.dataset.c,cps=cp.filter(c=>c.roundId==rid).sort((x,y)=>x.position-y.position);
      if(a=='gps'){const p=await fresh();if(!p)return toast('Position GPS indisponible');await W(updateDoc(doc(db,'checkpoints',cid),{lat:p.latitude,lng:p.longitude,gpsAccuracy:p.accuracy}));toast('Position enregistrée (±'+Math.round(p.accuracy)+' m)');return go('ro')}
      if(a=='sheet')return sheet(cps.filter(c=>c.active),sn+' – '+r.name);
      if(a=='qr')return sheet([cps.find(c=>c.id==cid)],sn+' – '+r.name);
      if(a=='del'){const c=cps.find(x=>x.id==cid);if(!c||!confirm('Supprimer le point « '+c.name+' » ?\nSon QR code ne fonctionnera plus. Les scans déjà enregistrés sont conservés.'))return;
        const b=writeBatch(db);b.delete(doc(db,'checkpoints',cid));b.delete(doc(db,'qrSecrets',cid));
        cps.filter(x=>x.id!=cid).forEach((x,i)=>{if(x.position!=i+1)b.update(doc(db,'checkpoints',x.id),{position:i+1})});   // renumérote les points restants
        await W(b.commit());toast('Point supprimé');return go('ro')}
      if(a=='tog'){await W(updateDoc(doc(db,'checkpoints',cid),{active:t.dataset.on!='true'}));return go('ro')}
      if(a=='up'||a=='dn'){const i=cps.findIndex(c=>c.id==cid),j=a=='up'?i-1:i+1;if(j<0||j>=cps.length)return;
        const b=writeBatch(db);b.update(doc(db,'checkpoints',cps[i].id),{position:cps[j].position});b.update(doc(db,'checkpoints',cps[j].id),{position:cps[i].position});await W(b.commit());go('ro')}};
  }
};
async function sheet(cps,title){
  const ov=document.createElement('div');ov.id='pr';
  ov.innerHTML=`<div class=np><button onclick="print()">Imprimer / Enregistrer en PDF</button><button class=s onclick="this.closest('#pr').remove()">Fermer</button></div><h2>${esc(title)}</h2><div class=pg></div>`;
  document.body.append(ov);
  for(const c of cps){
    let s;try{s=await getDoc(doc(db,'qrSecrets',c.id))}catch(e){toast(errm(e));continue}
    if(!s.exists()){toast('Jeton introuvable pour '+c.name);continue}
    const q=qrcode(0,'M');q.addData('SL1:'+c.id+'.'+s.data().token);q.make();
    ov.querySelector('.pg').insertAdjacentHTML('beforeend',`<div class=qr>${q.createSvgTag({cellSize:5,margin:2,scalable:true})}<b>${esc(c.name)}</b><small>Point n°${c.position}</small></div>`);
  }
}
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
</script></body></html>
